<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GREEN DREAM | Nhập hàng</title><style>body{font-family:system-ui;background:#f4f8ed;color:#273b2c;max-width:1100px;margin:auto;padding:20px}main,section{background:white;padding:18px;border-radius:14px;margin:12px 0}form{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}label{display:block;font-size:13px}input,select,button{width:100%;padding:10px;margin-top:5px;box-sizing:border-box}button{background:#4d773c;color:white;border:0;border-radius:7px;cursor:pointer}table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:8px;border-bottom:1px solid #ddd;text-align:left}div.scroll{overflow:auto}#status{font-weight:bold}a{color:#4d773c}</style></head><body><h1>GREEN DREAM — Nhập hàng</h1><a href="/">← Quay lại Operation</a><main><label>Mã truy cập kho (được cấu hình tại Vercel)<input id="token" type="password" autocomplete="off"></label><button id="load">Kết nối / Tải lại từ Google Sheets</button><p id="status"></p></main><section><h2>Nhập nguyên liệu và vật tư</h2><form id="form"><label>Ngày nhập<input id="date" type="date" required></label><label>Nhóm<select id="group"></select></label><label>Nguyên liệu<select id="item" required></select></label><label>Khối lượng / số lượng<input id="qty" type="number" step="any" min="0.001" required></label><label>Đơn vị nhập<select id="unit"></select></label><label>Đơn giá (₫)<input id="price" type="number" min="0" step="any" placeholder="Chưa biết giá có thể bỏ trống"></label><label>Đơn vị báo giá<select id="quote"></select></label><label>Nhà cung cấp<select id="supplier"></select></label><label>Số hóa đơn<input id="invoice"></label><label>Ghi chú<input id="note"></label><button type="submit">Lưu hàng nhập</button></form></section><section><h2>Lịch sử (nhấn tải lại để cập nhật từ Sheets)</h2><div class="scroll"><table><thead><tr><th>Ngày</th><th>Mã phiếu</th><th>Nhóm</th><th>Nguyên liệu</th><th>Lượng</th><th>Giá</th><th>Tổng</th><th>NCC</th></tr></thead><tbody id="history"></tbody></table></div></section><script>
const $=id=>document.getElementById(id),units=['g','kg','ml','lít','cái','túi','hộp','cuộn','chai','gói','thùng'];let data={groups:[],materials:[],suppliers:[],entries:[]};
const opt=(v,t)=>{let o=document.createElement('option');o.value=v;o.textContent=t??v;return o};const fill=(id,values)=>$(id).replaceChildren(...values.map(v=>Array.isArray(v)?opt(v[0],v[1]):opt(v)));
fill('unit',units);fill('quote',units);$('date').value=new Date().toLocaleDateString('sv-SE');
function redraw(){fill('group',data.groups);const name=$('group').value;fill('item',[['','Chọn nguyên liệu'],...data.materials.map(x=>[x.name,x.code+' · '+x.name])]);fill('supplier',[['','Chưa chọn'],...data.suppliers.map(x=>[x.name,x.code+' · '+x.name])]);const t=$('history');t.replaceChildren();data.entries.slice().reverse().slice(0,300).forEach(r=>{const tr=document.createElement('tr');[r.date,r.entryCode,r.group,r.item,r.quantity+' '+r.unit,r.unitPrice+' / '+r.quoteUnit,r.total,r.supplier].forEach(v=>{const td=document.createElement('td');td.textContent=v??'';tr.append(td)});t.append(tr)})}
async function api(method='GET',payload){const headers={'x-inventory-token':$('token').value};if(payload)headers['content-type']='application/json';const r=await fetch('/api/inventory',{method,headers,body:payload?JSON.stringify(payload):undefined,cache:'no-store'});const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'Không thể kết nối');return j}
async function load(){try{data=await api();redraw();$('status').textContent='Đã tải '+data.entries.length+' dòng nhập';}catch(e){$('status').textContent=e.message}}
$('load').onclick=load;$('item').onchange=()=>{const m=data.materials.find(x=>x.name===$('item').value);if(m&&units.includes(m.unit)){$('unit').value=m.unit;$('quote').value=m.unit}};
$('form').onsubmit=async e=>{e.preventDefault();const get=id=>$(id).value;const row={date:get('date'),group:get('group'),item:get('item'),quantity:get('qty'),unit:get('unit'),unitPrice:get('price'),quoteUnit:get('quote'),supplier:get('supplier'),invoice:get('invoice'),note:get('note')};try{await api('POST',row);$('status').textContent='Đã lưu';await load()}catch(err){$('status').textContent=err.message}};
</script></body></html>
